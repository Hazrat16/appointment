name: CI

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: "18"

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Backend security audit
        run: |
          cd backend
          npm audit --audit-level moderate || echo "npm audit reported issues (non-blocking)"

      - name: Frontend security audit
        run: |
          cd frontend
          npm audit --audit-level moderate || echo "npm audit reported issues (non-blocking)"

      - name: Backend lint
        run: |
          cd backend
          npm run lint

      - name: Frontend lint
        run: |
          cd frontend
          npm run lint

      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Console.log scan (informational)
        run: |
          if grep -r "console\.log" frontend/src --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" 2>/dev/null; then
            echo "Found console.log in frontend — consider removing for production"
          else
            echo "No console.log in frontend/src"
          fi

      - name: TODO/FIXME scan (informational)
        run: |
          if grep -r "TODO\|FIXME" frontend/src backend/src --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" 2>/dev/null; then
            echo "Found TODO/FIXME — review before release"
          else
            echo "No TODO/FIXME in scanned paths"
          fi

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Backend tests
        run: |
          cd backend
          npm run test 2>/dev/null && echo "Backend tests finished" || echo "Backend tests skipped or failed (non-blocking)"

      - name: Frontend build
        run: |
          cd frontend
          npm run build

      - name: Verify Next.js output
        run: |
          cd frontend
          test -d .next || (echo "Missing .next output" && exit 1)
          ls -la .next/

      - name: Bundle sample (informational)
        run: |
          cd frontend
          if [ -d ".next/static" ]; then
            find .next/static -name "*.js" -exec ls -lh {} \; | head -5
          fi
